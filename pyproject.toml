[project]
name = "flowire"
authors = [{ name = "Flowire", email = "dev@flowire.app" }]
description = "Flowire CRM — the Frappe app installed on every tenant site"
readme = "README.md"
# Tighten to ">=3.14,<3.15" once Phase 0 (Frappe/ERPNext v16) is complete — v16
# requires Python 3.14, but v15 still allows >=3.10 and this app must install on
# both during the transition.
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
