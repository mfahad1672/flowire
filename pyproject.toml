[project]
name = "flowire"
authors = [{ name = "Netlogg", email = "dev@flowire.app" }]
description = "Flowire CRM customizations for ERPNext"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Compatible with both Frappe majors: production runs v15 today, v16 is the
# eventual target. Testing happens on v15 — see the plan, ground rule 3.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.bench.dev-dependencies]
